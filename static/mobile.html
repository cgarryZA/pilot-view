<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <title>Pilot View</title>
    <link rel="stylesheet" href="/static/mobile.css" />
    <!-- three.js vendored locally so the app works with zero internet on the AP. -->
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/three.module.js",
          "three/addons/": "/static/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div class="m-app">
      <main class="m-stage" id="stage">
        <img class="m-bg" id="m-bg" alt="" />
        <div class="m-canvas" id="m-canvas"></div>

        <div class="m-top">
          <div class="m-chips">
            <button class="m-chip tap" id="chip-source" type="button"><span class="m-dot" id="conn-dot"></span><span id="src-name">—</span></button>
            <button class="m-chip tap" id="chip-vehicle" type="button">—</button>
            <button class="m-chip tap" id="chip-mute" type="button" aria-pressed="false" title="Alert sound">🔊</button>
          </div>
          <div class="m-viewtoggle" id="viewtoggle">
            <button class="active" data-mode="live" type="button">Live</button>
            <button data-mode="orbit" type="button">3D</button>
          </div>
        </div>

        <div class="m-state state-safe" id="state-badge"><span id="state-text">—</span></div>

        <!-- Big, glanceable proximity callout. Hidden unless warning/danger. -->
        <div class="m-stop hidden" id="stop-banner"><span id="stop-text">STOP</span></div>

        <div class="m-disc hidden" id="disc">
          <div class="m-disc-title">NO CAMERA SIGNAL</div>
          <div class="m-disc-sub" id="disc-sub">Waiting for the camera…</div>
        </div>

        <div class="m-clear" id="clearances">
          <div class="m-clear-cell" data-key="front"><span>Front</span><b id="cl-front">—</b></div>
          <div class="m-clear-cell" data-key="rear"><span>Rear</span><b id="cl-rear">—</b></div>
          <div class="m-clear-cell" data-key="left"><span>Left</span><b id="cl-left">—</b></div>
          <div class="m-clear-cell" data-key="right"><span>Right</span><b id="cl-right">—</b></div>
          <div class="m-clear-cell" data-key="ceiling"><span>Roof</span><b id="cl-ceiling">—</b></div>
        </div>
      </main>

      <nav class="m-tabs">
        <a class="m-tab active" id="tab-drive">Drive</a>
        <a class="m-tab" id="tab-align">Align</a>
        <a class="m-tab" href="/terminal">Terminal</a>
        <a class="m-tab" href="/?desktop=1">Desktop</a>
      </nav>
    </div>

    <div class="m-sheet hidden" id="cal-sheet">
      <div class="m-sheet-bar">
        <span class="m-sheet-title">CALIBRATION</span>
        <button class="m-sheet-x" id="cal-close" type="button">×</button>
      </div>
      <button class="m-sheet-primary" id="cal-align" type="button">Auto-align &amp; measure from depth</button>
      <div class="m-sheet-status" id="cal-status">Finds the floor + walls and measures the garage. Nudge any value below if a wall wasn't fully visible.</div>
      <div class="m-sheet-grid">
        <label>Width <input type="number" step="0.05" min="1.5" max="6" data-path="garage.width" /></label>
        <label>Length <input type="number" step="0.05" min="2" max="12" data-path="garage.length" /></label>
        <label>Height <input type="number" step="0.05" min="1.8" max="4" data-path="garage.height" /></label>
        <label>Door&nbsp;W <input type="number" step="0.05" min="1.5" max="5" data-path="garage.door_opening_width" /></label>
        <label>Door&nbsp;H <input type="number" step="0.05" min="1.5" max="3" data-path="garage.door_opening_height" /></label>
      </div>
    </div>

    <div class="m-toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/static/mobile.js"></script>
  </body>
</html>
