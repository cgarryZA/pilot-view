<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <title>Pilot View — Depth Cloud</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/static/vendor/three/three.module.js",
          "three/addons/": "/static/vendor/three/addons/"
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #04070d; color: #cfe6ff;
        font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
      #c { position: fixed; inset: 0; }
      .hud { position: fixed; top: 10px; left: 10px; z-index: 5; font-size: 12px;
        background: rgba(7,13,24,.8); border: 1px solid #15324a; border-radius: 10px;
        padding: 8px 12px; line-height: 1.5; }
      .hud b { color: #6fd3ff; }
      .hud .err { color: #ff6b6b; }
      a { color: #6fd3ff; }
      .hud button { background:#0e1c2c; color:#cfe6ff; border:1px solid #1f4a66;
        border-radius:7px; padding:5px 11px; font:inherit; font-size:12px; cursor:pointer; }
      .hud button.on { background:#6fd3ff; color:#042; border-color:#6fd3ff; }
    </style>
  </head>
  <body>
    <div id="c"></div>
    <div class="hud">
      <div>PILOT VIEW · <b>DEPTH CLOUD</b> &nbsp; <a href="/">← app</a></div>
      <div id="stat">starting camera…</div>
      <div style="margin-top:4px">
        <button id="mode-range">Range</button>
        <button id="mode-seg" class="on">Objects</button>
      </div>
      <div style="color:#7790ab">drag to orbit · scroll to zoom</div>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      const container = document.getElementById('c');
      const statEl = document.getElementById('stat');

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.add(new THREE.GridHelper(10, 20, 0x2a4055, 0x16283a));
      scene.add(new THREE.AxesHelper(0.5));

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 100);
      camera.position.set(0, 1.2, 1.8);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, -2.2);
      controls.update();

      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
      geom.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));
      const mat = new THREE.PointsMaterial({ size: 0.012, sizeAttenuation: true, vertexColors: true });
      const cloud = new THREE.Points(geom, mat);
      scene.add(cloud);

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      let mode = 'seg';  // 'seg' (object segmentation) or 'range'
      const btnRange = document.getElementById('mode-range');
      const btnSeg = document.getElementById('mode-seg');
      btnRange.onclick = () => { mode = 'range'; btnRange.classList.add('on'); btnSeg.classList.remove('on'); };
      btnSeg.onclick = () => { mode = 'seg'; btnSeg.classList.add('on'); btnRange.classList.remove('on'); };

      // colour points by range: near = warm, far = cool
      function colorFor(z, out, i) {
        const r = Math.min(1, Math.max(0, (-z - 0.3) / (6 - 0.3)));
        out[i] = 1 - r * 0.8;
        out[i + 1] = 0.4 + r * 0.2;
        out[i + 2] = 0.2 + r * 0.8;
      }

      function setCloud(pos, col, n) {
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
        geom.computeBoundingSphere();
        statEl.innerHTML = `points: <b>${n.toLocaleString()}</b> · ${mode === 'seg' ? 'objects' : 'range'}`;
      }

      async function poll() {
        try {
          if (mode === 'seg') {
            const res = await fetch('/api/depth/segments', { cache: 'no-store' });
            const f = new Float32Array(await res.arrayBuffer());
            const n = Math.floor(f.length / 6);
            if (n > 0) setCloud(f.slice(0, n * 3), f.slice(n * 3, n * 6), n);
            else statEl.innerHTML = 'no depth points (camera starting or out of range)';
          } else {
            const res = await fetch('/api/depth/cloud', { cache: 'no-store' });
            const pos = new Float32Array(await res.arrayBuffer());
            const n = pos.length / 3;
            if (n > 0) {
              const col = new Float32Array(pos.length);
              for (let i = 0; i < pos.length; i += 3) colorFor(pos[i + 2], col, i);
              setCloud(pos, col, n);
            } else {
              statEl.innerHTML = 'no depth points (camera starting or out of range)';
            }
          }
        } catch (e) {
          statEl.innerHTML = `<span class="err">error: ${e.message || e}</span>`;
        }
        setTimeout(poll, mode === 'seg' ? 350 : 150);
      }
      poll();

      (function render() {
        requestAnimationFrame(render);
        controls.update();
        renderer.render(scene, camera);
      })();
    </script>
  </body>
</html>
