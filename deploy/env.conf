# Drop-in so the service reads the project .env (runtime source switches persist
# there). The leading "-" makes a missing file non-fatal.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/pilot-view.service.d
#   sudo cp deploy/env.conf /etc/systemd/system/pilot-view.service.d/env.conf
#   sudo systemctl daemon-reload && sudo systemctl restart pilot-view
[Service]
EnvironmentFile=-/home/pilot-view/pilot-view/.env
